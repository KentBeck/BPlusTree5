[package]
name = "bplustree-compat"
version = "0.1.0"
edition = "2021"
description = "Drop-in std::collections::BTreeMap/BTreeSet API over bplustree::BPlusTreeMap"
license = "MIT"

[dependencies]
bplustree = { path = "..", default-features = false }
serde = { version = "1", optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
