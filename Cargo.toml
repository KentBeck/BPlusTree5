[package]
name = "bplustree"
version = "0.1.0"
edition = "2021"
description = "A B+ tree map with the API of std::collections::BTreeMap"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
# Enables the `internal` feature for the test suite only: integration tests
# drive the tree at small node capacities and assert on its invariants, and
# neither knob is part of the public API. A plain `cargo build` compiles the
# library without them.
bplustree = { path = ".", features = ["internal"] }
serde_json = "1"

[features]
default = []
# Node capacities, invariant checks and shape dumps for this repository's own
# tests and benchmarks. Not public API; see src/internal.rs.
internal = []
# Adds per-map counters for diagnosing deletion repair work. Normal builds
# contain neither the counters nor the instrumentation updates.
delete_profile = []

[profile.release]
debug = true

[[bin]]
name = "asm_test"
path = "src/bin/asm_test.rs"
# Benchmarks and profiling tools: they set node capacities and read node
# internals, so they build only with the `internal` feature.
required-features = ["internal"]

