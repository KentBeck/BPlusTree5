[package]
name = "bplustree"
version = "0.1.0"
edition = "2021"
description = "Raw-memory B+ tree map with fixed-size nodes"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
# old_bplustree = { package = "bplustree", path = "vendor/BPlusTree3/rust" }

[features]
default = ["compat_test_api"]
# Enables test-only compatibility APIs used by the imported test suites.
compat_test_api = []
# Adds per-map counters for diagnosing deletion repair work. Normal builds
# contain neither the counters nor the instrumentation updates.
delete_profile = []

[profile.release]
debug = true
